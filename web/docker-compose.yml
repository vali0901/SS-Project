services:
  # Go API Service
  go-api:
    build: ./server
    user: "${UID}:${GID}"
    container_name: go-api
    image: server
    env_file: .env
    environment:
      - MQTT_HOST_IP=broker
      - OCR_SERVICE_HOST=ocr-service
      - OCR_SERVICE_PORT=50051
    depends_on:
      - postgres-db
      - broker
      - ocr-service
    ports:
      - 8080:8080
    volumes:
      - ./uploads:/app/uploads
    networks:
      - backend
    secrets:
      - ca.crt
      - web.crt
      - web.key
      - encryption.key

  client:
    build: ./client
    user: "${UID}:${GID}"
    container_name: client
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - backend
    depends_on:
      - go-api

  broker:
    user: "${UID}:${GID}"
    image: eclipse-mosquitto:latest
    container_name: broker
    hostname: broker
    ports:
      - "8883:8883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - backend
    secrets:
      - ca.crt
      - server.crt
      - server.key

  # OCR Service - Sandboxed image processing
  ocr-service:
    build: ./ocr-service
    container_name: ocr-service
    hostname: ocr-service
    networks:
      - backend
    read_only: true
    # Temporary filesystem for Tesseract cache
    tmpfs:
      - /tmp
      - /home/nonroot
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "ocr.OCRService/ExtractText"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
    - ./secrets:/run/secrets:ro

  postgres-db:
    container_name: postgres-db
    hostname: postgres-db
    image: postgres:15
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:

secrets:
  ca.crt:
    file: ./secrets/ca.crt
  web.crt:
    file: ./secrets/web.crt
  web.key:
    file: ./secrets/web.key
  server.crt:
    file: ./secrets/server.crt
  server.key:
    file: ./secrets/server.key
  ocr.crt:
    file: ./secrets/ocr.crt
  ocr.key:
    file: ./secrets/ocr.key
  encryption.key:
    file: ./secrets/encryption.key
