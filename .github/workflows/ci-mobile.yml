name: Mobile CI/CD

on:
  workflow_call:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - ".github/workflows/ci-mobile.yml"
      - "mobile/**"
      - "web/scripts/gen-ca.sh"
      - "web/scripts/gen-android-stores.sh"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ci-mobile.yml"
      - "mobile/**"
      - "web/scripts/gen-ca.sh"
      - "web/scripts/gen-android-stores.sh"

permissions:
  contents: read

jobs:
  mobile_checks:
    name: Build and Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Android mTLS resources
        working-directory: web
        run: |
          bash scripts/gen-ca.sh
          bash scripts/gen-android-stores.sh

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run Semgrep (static analysis)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep
          semgrep --config p/default .

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          working-directory: mobile
          script: ./gradlew connectedDebugAndroidTest

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: |
            mobile/app/build/reports/tests/
            mobile/app/build/reports/androidTests/
            mobile/app/build/outputs/androidTest-results/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Release APK
    if: startsWith(github.ref, 'refs/tags/')
    needs: mobile_checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: artifacts

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
