name: AI Quarantine Promotion

on:
  push:
    branches:
      - 'quarantine/**'

jobs:
  # 1. Call existing Web CI (Plan 4)
  web-validation:
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  # 2. Call existing Mobile CI (Plan 4)
  mobile-validation:
    uses: ./.github/workflows/ci-mobile.yml
    secrets: inherit

  # 3. Promote to PR (Plan 2 & 3: Supervision & Quarantine)
  promote:
    name: Promote to PR
    needs: [web-validation, mobile-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR with Audit Evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract branch names
          Q_BRANCH=${GITHUB_REF#refs/heads/}
          P_BRANCH=${Q_BRANCH#quarantine/}
          
          # Extract Audit Logs (Plan 5)
          AUDIT_LOGS=$(tail -n 30 ai-governance/audit.log)
          
          # Push clean feature branch
          git config user.name "AI Orchestrator"
          git config user.email "ai-orchestrator@users.noreply.github.com"
          git checkout -b "$P_BRANCH"
          git push origin "$P_BRANCH" --force
          
          # Create PR with Expandable Audit Logs
          PR_BODY=$(cat <<EOF
          ## AI Code Promotion: $P_BRANCH
          
          All CI/CD checks from \`ci-web\` and \`ci-mobile\` passed successfully.
          
          <details>
          <summary>📜 View AI Audit Logs (Plan 5 Evidence)</summary>
          
          \`\`\`
          $AUDIT_LOGS
          \`\`\`
          
          </details>
          
          ### 🔍 Validation Status
          - [x] Web CI Passed
          - [x] Mobile CI Passed
          - [x] RBAC Zones Enforced
          EOF
          )
          
          gh pr create --title "AI Patch: $P_BRANCH" --body "$PR_BODY" --head "$P_BRANCH" --base main
