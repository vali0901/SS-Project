name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Acest default se aplică doar dacă nu specificăm altfel la nivel de pas
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # ==========================================
      # 1. GO BACKEND
      # ==========================================
      - name: Install system dependencies (tesseract + leptonica)
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev tesseract-ocr

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # Actualizat la 1.25 pentru a potrivi cu go.mod
          cache-dependency-path: web/server/go.sum

      - name: Download Go dependencies
        working-directory: web/server
        run: go mod download

      - name: Install Mockgen
        run: |
          go install go.uber.org/mock/mockgen@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate Mocks
        working-directory: web/server
        run: |
          mkdir -p mocks

          mockgen -package=mock_domain -destination=mocks/user_mock.go mqtt-streaming-server/domain UserRepository
          mockgen -package=mock_domain -destination=mocks/photo_mock.go mqtt-streaming-server/domain PhotoRepository
          mockgen -package=mock_domain -destination=mocks/device_mock.go mqtt-streaming-server/domain DeviceRepository

      - name: Go build
        working-directory: web/server
        run: go build ./...

      - name: Go test and Coverage
        working-directory: web/server
        run: |
          # Rulăm testele cu verbose (-v) și salvare în fișier text pentru primul artifact
          go test -covermode=atomic -coverprofile=coverage.out ./... -v 2>&1 | tee test-results.txt
          
          # Curățăm mock-urile din coverage pentru al doilea artifact
          grep -v 'mocks/' coverage.out > coverage_clean.out
          
          # Afișăm totalul în consolă
          go tool cover -func=coverage_clean.out

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results
          path: web/server/test-results.txt

      - name: Upload Go coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: web/server/coverage_clean.out
 
      # ==========================================
      # 2. REACT/VITE FRONTEND
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: web/client/yarn.lock

      - name: Install client dependencies
        working-directory: web/client
        run: yarn install --frozen-lockfile

      - name: Client lint
        working-directory: web/client
        run: yarn lint

      - name: Client build
        working-directory: web/client
        run: yarn build
 
      # ==========================================
      # 3. DOCKER BUILD
      # ==========================================
      - name: Docker build API image
        working-directory: web/server
        run: docker build -t ss-web-api:test .